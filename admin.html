<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>NQ PROJECT · Ruleta</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Acceso -->
  <section id="gate" class="gate hidden">
    <div class="brand" style="justify-content:center">
      <img src="assets/logo.png" alt="NQ PROJECT" onerror="this.remove(); document.getElementById('wmGate').classList.remove('hidden')">
      <div id="wmGate" class="wordmark hidden"><b>NQ</b> PROJECT</div>
    </div>
    <div class="card">
      <h2 style="margin-top:0">Panel del sorteo</h2>
      <p id="gateMsg">Solo el administrador puede entrar.</p>
      <button id="loginBtn" class="btn">Entrar con Google</button>
      <button id="logoutGate" class="ghost hidden" style="margin-top:10px;width:100%">Cerrar sesión</button>
    </div>
  </section>

  <!-- Panel -->
  <main id="app" class="admin hidden">
    <div class="topbar">
      <div class="brand">
        <img src="assets/logo.png" alt="NQ PROJECT" onerror="this.remove(); document.getElementById('wm').classList.remove('hidden')">
        <div id="wm" class="wordmark hidden"><b>NQ</b> PROJECT</div>
        <span id="demoBadge" class="demo-badge hidden">Modo demo</span>
      </div>
      <div class="right">
        <label class="toggle"><input id="streamMode" type="checkbox" checked> Modo stream (ocultar contactos)</label>
        <button id="logoutBtn" class="ghost">Salir</button>
      </div>
    </div>

    <div class="grid">
      <section class="stage">
        <div class="stage-head">
          <h2>Sorteo <span id="prizeLabel">Cuenta de fondeo</span></h2>
          <div class="counter"><b id="count">0</b> participantes · <b id="eligible">0</b> en la ruleta</div>
        </div>
        <div class="wheel-box">
          <div class="pointer"></div>
          <canvas id="wheel"></canvas>
        </div>
        <div id="ticker" class="ticker">&nbsp;</div>
        <button id="spinBtn" class="btn spin-btn">GIRAR RULETA</button>
        <div id="hint" class="hint"></div>
      </section>

      <aside class="side">
        <div class="panel">
          <h3>Registros <small id="regState">—</small></h3>
          <div class="reg-toggle">
            <span id="regText" style="color:var(--muted);font-size:14px">Cargando…</span>
            <button id="regBtn" class="btn">Abrir registros</button>
          </div>
        </div>

        <div class="panel">
          <h3>Ganadores <small id="winCount">0 / 5</small></h3>
          <ul id="winners" class="winners"></ul>
          <div class="row-btns">
            <button id="resetBtn" class="ghost danger">Reiniciar ganadores</button>
          </div>
        </div>

        <div class="panel">
          <h3>Participantes <small id="pCount">0</small></h3>
          <input id="search" class="search" placeholder="Buscar por nombre o correo">
          <div id="plist" class="plist"></div>
          <div class="row-btns">
            <button id="csvBtn" class="ghost">Descargar lista (CSV)</button>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <div id="modal" class="modal hidden">
    <div class="box">
      <div class="tag" id="mTag">🏆 Ganador #1</div>
      <h2 id="mName">—</h2>
      <p id="mSub">—</p>
      <button id="mClose" class="btn">Continuar</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script type="module" src="admin.js"></script>
</body>
</html>
